[package]
name = "aw-pomodoro-service"
version = "0.1.0"
edition = "2021"
description = "Local Pomodoro service and API for ActivityWatch"
authors = ["ActivityWatch Contributors"]
repository = "https://github.com/ActivityWatch/aw-notify-rs"
license = "MPL-2.0"

[dependencies]
aw-pomodoro-core = { path = "../aw-pomodoro-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
